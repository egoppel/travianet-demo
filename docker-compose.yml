name: travianet

# VPS deployment (same pattern as PPGCRM: Traefik with the external `traefik-public`
# network and a Let's Encrypt resolver). Copy .env.example to .env and set the values.
services:
  api:
    image: ${API_IMAGE:-dabikkel/travianet-api:latest}
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      NODE_ENV: production
      API_KEY: ${API_KEY:?set API_KEY in .env}
      ADMIN_KEY: ${ADMIN_KEY:-}
      TOKEN_TTL_MINUTES: ${TOKEN_TTL_MINUTES:-30}
      MAX_AUTH_ATTEMPTS: ${MAX_AUTH_ATTEMPTS:-2}
      MAX_FORMAT_ERRORS: ${MAX_FORMAT_ERRORS:-3}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-de}
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.travianet-api.rule=Host(`${API_HOST:-travianet.voiceaidemo.avvid.nl}`)"
      - "traefik.http.routers.travianet-api.entrypoints=websecure"
      - "traefik.http.routers.travianet-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.travianet-api.loadbalancer.server.port=8080"

networks:
  traefik-public:
    external: true
